<title>Tsuzuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --bg-2:#f4f6f9; --ink:#0b0d12; --ink-2:#3a404c; --muted:#6b7280; --line:#e3e6ec;
  --blue:#1f56e0; --blue-ink:#ffffff; --blue-soft:#eaf0fe; --blue-line:#c7d6fb;
  --point-bg:#eaf0fe; --point-bd:#1f56e0;
  --memo-bg:#f3f4f6; --memo-bd:#4b5563;
  --warn-bg:#fff5e3; --warn-bd:#c27a12;
  --sum-bg:#0b0d12; --sum-ink:#ffffff;
  --ok:#138a52; --ok-soft:#e5f5ec; --ng:#d23f3f; --ng-soft:#fdeaea;
  --code-bg:#0f1115; --code-ink:#e6e9ef;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:"M PLUS 1 Code","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a0b0e; --bg-2:#13151a; --ink:#f2f4f8; --ink-2:#c6cbd5; --muted:#8b93a3; --line:#262a33;
    --blue:#5b8cff; --blue-ink:#0a0b0e; --blue-soft:#16213d; --blue-line:#2a3d70;
    --point-bg:#16213d; --point-bd:#5b8cff; --memo-bg:#1a1d24; --memo-bd:#8b93a3; --warn-bg:#2a2010; --warn-bd:#e0a03a;
    --sum-bg:#f2f4f8; --sum-ink:#0b0d12;
    --ok:#3fbf7f; --ok-soft:#10261b; --ng:#ff6b6b; --ng-soft:#2c1414; --code-bg:#13151a; --code-ink:#e6e9ef;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0b0e; --bg-2:#13151a; --ink:#f2f4f8; --ink-2:#c6cbd5; --muted:#8b93a3; --line:#262a33;
  --blue:#5b8cff; --blue-ink:#0a0b0e; --blue-soft:#16213d; --blue-line:#2a3d70;
  --point-bg:#16213d; --point-bd:#5b8cff; --memo-bg:#1a1d24; --memo-bd:#8b93a3; --warn-bg:#2a2010; --warn-bd:#e0a03a;
  --sum-bg:#f2f4f8; --sum-ink:#0b0d12;
  --ok:#3fbf7f; --ok-soft:#10261b; --ng:#ff6b6b; --ng-soft:#2c1414; --code-bg:#13151a; --code-ink:#e6e9ef;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--blue);z-index:20;transition:width .1s linear}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .k{font-family:var(--serif);font-weight:800;font-size:26px;line-height:1;width:38px;height:38px;display:grid;place-items:center;background:var(--ink);color:var(--bg);border-radius:4px}
.logo .w{font-size:12px;letter-spacing:.32em;font-weight:700}
.bar nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--bg-2)}
.btn.armed{border-color:var(--ng);color:var(--ng)}
.btn:disabled{opacity:.5;cursor:default}

main{padding-inline:16px}
.wrap{max-width:1180px;margin:0 auto}

/* ホーム */
.home-head{max-width:760px;margin:0 auto;padding-block:56px 32px}
.home-head h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.3;margin:0 0 10px;text-wrap:balance}
.home-head p{margin:0;color:var(--muted)}
.posts{max-width:760px;margin:0 auto 80px;border-top:2px solid var(--ink)}
.post-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 20px;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.post-row:hover .t{color:var(--blue)}
.post-row time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:6px;letter-spacing:.04em}
.post-row .t{font-family:var(--serif);font-weight:800;font-size:21px;line-height:1.45;margin:0;text-wrap:balance}
.post-row .x{grid-column:2;margin:4px 0 0;color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11.5px;letter-spacing:.04em;border:1px solid var(--blue-line);color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.chip.draft{border-color:var(--line);background:var(--bg-2);color:var(--muted)}
.empty-note{padding:40px 0;color:var(--muted);text-align:center}

/* 記事 */
.post-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;max-width:1180px;margin:0 auto;padding-block:48px 96px}
@media (min-width:1100px){.post-layout{grid-template-columns:minmax(0,1fr) 680px 220px}.post-layout .article{grid-column:2}.toc{grid-column:3}}
.article{max-width:680px;margin:0 auto;width:100%}
.article-head{margin-bottom:36px}
.article-head h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,4.2vw,36px);line-height:1.4;margin:0 0 16px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.toc{display:none}
@media (min-width:1100px){
  .toc{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;font-size:13px}
  .toc h2{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:0 0 10px;font-weight:700}
  .toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
  .toc li a{display:block;padding:4px 0 4px 12px;color:var(--ink-2);text-decoration:none;margin-left:-1px;border-left:2px solid transparent;line-height:1.5}
  .toc li.l3 a{padding-left:24px;font-size:12.5px}
  .toc li a:hover,.toc li a.on{color:var(--blue);border-left-color:var(--blue)}
}
.post-foot{margin-top:56px;padding-top:24px;border-top:2px solid var(--ink);display:grid;gap:18px}
.post-foot h2{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:0 0 8px}
.post-foot ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.post-foot li a{font-family:var(--serif);font-weight:800;font-size:17px;text-decoration:none}

/* 本文 */
.prose{font-size:16px;line-height:2;color:var(--ink)}
.prose > *:first-child{margin-top:0}
.prose p{margin:0 0 1.3em}
.prose h2{font-family:var(--serif);font-weight:800;font-size:24px;line-height:1.5;margin:2.4em 0 .9em;padding-top:.7em;border-top:2px solid var(--ink);text-wrap:balance;scroll-margin-top:90px}
.prose h3{font-size:18.5px;line-height:1.5;margin:2em 0 .6em;padding-left:.7em;border-left:4px solid var(--blue);text-wrap:balance;scroll-margin-top:90px}
.prose h4{font-size:16px;margin:1.6em 0 .4em}
.prose ul,.prose ol{margin:0 0 1.3em;padding-left:1.5em}
.prose li{margin:.15em 0}
.prose li::marker{color:var(--blue)}
.prose blockquote{margin:0 0 1.4em;padding:.2em 0 .2em 1.2em;border-left:3px solid var(--ink);color:var(--ink-2)}
.prose blockquote p:last-child{margin-bottom:0}
.prose mark{background:linear-gradient(transparent 58%,#ffe58a 58%);color:inherit;padding:0 .05em}
:root[data-theme="dark"] .prose mark{background:linear-gradient(transparent 58%,rgba(255,214,90,.42) 58%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prose mark{background:linear-gradient(transparent 58%,rgba(255,214,90,.42) 58%)}}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--bg-2);border:1px solid var(--line);padding:.05em .35em;border-radius:4px}
.prose pre{background:var(--code-bg);color:var(--code-ink);padding:16px 18px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.75;margin:0 0 1.4em}
.prose pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.prose hr{border:0;height:1px;background:var(--line);margin:2.6em 0}
.prose figure{margin:0 0 1.6em}
.prose figure img,.prose figure video{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line);background:var(--bg-2)}
.prose figcaption{font-size:13px;color:var(--muted);margin-top:.5em;text-align:center}
.tbl{overflow-x:auto;margin:0 0 1.6em}
.prose table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.7}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:.6em .8em;text-align:left;vertical-align:top}
.prose thead th{border-bottom:2px solid var(--ink);font-weight:700;white-space:nowrap}
.prose .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:2em 0}
.prose .cta{display:inline-block;background:var(--blue);color:var(--blue-ink);text-decoration:none;font-weight:700;padding:.75em 2em;border-radius:999px}
.prose .cta:hover{filter:brightness(1.08)}
.wl{text-decoration:none;border-bottom:1px solid var(--blue-line);padding-bottom:1px}
.wl::before{content:"→ ";font-size:.85em}
.wl.missing{color:var(--muted);border-bottom-style:dashed}
.gl{background:none;border:0;padding:0;color:inherit;cursor:help;border-bottom:1.5px dotted var(--blue);font:inherit;line-height:inherit}
#tip{position:absolute;z-index:30;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);font-size:13.5px;line-height:1.7;padding:10px 12px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.card{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;color:inherit;margin:0 0 1.4em}
.card:hover{border-color:var(--blue)}
.card .h{font-size:11.5px;letter-spacing:.12em;color:var(--blue);font-weight:700}
.card .u{font-size:13px;color:var(--muted);word-break:break-all}
.card .play{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}

/* ボックス */
.box{border-radius:8px;padding:1.1em 1.4em;margin:0 0 1.5em;border:1.5px solid var(--bx-bd);background:var(--bx-bg)}
.box > *:last-child{margin-bottom:0}
.box .bx-t{font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--bx-bd);margin:0 0 .5em}
.box.point{--bx-bg:var(--point-bg);--bx-bd:var(--point-bd)}
.box.memo{--bx-bg:var(--memo-bg);--bx-bd:var(--memo-bd)}
.box.warn{--bx-bg:var(--warn-bg);--bx-bd:var(--warn-bd)}
.box.summary{--bx-bg:var(--sum-bg);--bx-bd:var(--sum-bg);color:var(--sum-ink)}
.box.summary .bx-t{color:var(--sum-ink);opacity:.7}
.box.summary li::marker{color:inherit}

/* 動く要素の共通枠 */
.live{border:1px solid var(--line);border-radius:10px;margin:0 0 1.8em;background:var(--bg);overflow:hidden}
.live-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.live-h .kind{font-size:10.5px;letter-spacing:.18em;font-weight:700;color:var(--blue);border:1px solid var(--blue-line);border-radius:3px;padding:0 6px;flex:none}
.live-h .ttl{font-weight:700;font-size:15px;line-height:1.5}
.live-b{padding:16px}
.live-b > *:last-child{margin-bottom:0}

.quiz-opts{display:grid;gap:8px}
.quiz-opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 14px;cursor:pointer;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.quiz-opt:hover:not(:disabled){border-color:var(--blue)}
.quiz-opt .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:2px;color:var(--muted)}
.quiz-opt:disabled{cursor:default}
.quiz-opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.quiz-opt.ok .n{color:var(--ok)}
.quiz-opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.quiz-opt.ng .n{color:var(--ng)}
.quiz-res{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg-2);font-size:14.5px;line-height:1.85}
.quiz-res strong.ok{color:var(--ok)} .quiz-res strong.ng{color:var(--ng)}
.quiz-res .again{margin-top:8px}

.calc-in{display:grid;gap:14px}
.calc-row label{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;margin-bottom:4px}
.calc-row .v{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.calc-row input[type=number]{width:96px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--bg)}
.calc-row input[type=range]{width:100%;accent-color:var(--blue)}
.calc-out{margin-top:16px;display:grid;gap:8px}
.calc-o{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:8px;padding:12px 16px}
.calc-o .l{font-size:13.5px;opacity:.8}
.calc-o .r{font-family:var(--serif);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.calc-o .r small{font-family:var(--sans);font-size:14px;font-weight:500;margin-left:4px;opacity:.85}
.calc-o.err .r{font-size:14px;font-family:var(--sans)}

.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.bars .lb{color:var(--ink-2);white-space:nowrap}
.bars .tr{height:22px;background:var(--bg-2);border-radius:3px;position:relative;overflow:hidden}
.bars .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:3px;transition:filter .15s}
.bars .vl{font-weight:700;text-align:right;min-width:3ch}
.bars .row-hit{display:contents;cursor:pointer}
.bars.focus .fill{filter:saturate(.25) opacity(.45)}
.bars.focus .on .fill,.bars .on .fill{filter:none}
.bars-note{margin-top:12px;font-size:13px;color:var(--muted);min-height:1.7em}
.bars-note strong{color:var(--ink)}

.tabbar{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px;background:var(--bg-2)}
.tabbar button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14px}
.tabbar button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--blue);font-weight:700}

.steps-dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps-dots button{border:0;padding:0;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.steps-dots button.done{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue)}
.steps-dots button.cur{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.steps-dots .lbl{margin-left:6px;font-weight:700;font-size:15px}
.steps-nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}

details.fold{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 1.6em}
details.fold summary{cursor:pointer;padding:12px 4px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"+";width:22px;height:22px;flex:none;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-size:14px;line-height:1}
details.fold[open] summary::before{content:"−"}
details.fold .fold-b{padding:0 4px 8px 36px}

.cmp{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg-2);user-select:none;touch-action:pan-y}
.cmp img{display:block;width:100%;height:auto;pointer-events:none}
.cmp .top{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.cmp .top img{width:100%;height:100%;object-fit:cover}
.cmp .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:var(--blue);transform:translateX(-1px);pointer-events:none}
.cmp .handle::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-size:15px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}

/* サイト設定（ホームで直接） */
.site-edit{display:grid;gap:10px;margin-top:16px;max-width:520px}
.site-edit input{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg);font-size:15px;color:var(--ink);width:100%}
.site-edit .row{display:flex;gap:8px}
.pr{position:relative}
.pr.w .post-row{padding-right:64px}
.row-edit{position:absolute;right:0;top:20px;font-size:12.5px;padding:4px 10px}

/* 編集 */
.editor{height:calc(100vh - 59px);height:calc(100dvh - 59px);display:flex;flex-direction:column;max-width:1500px;margin:0 auto;padding-block:12px}
.ed-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ed-bar .state{font-size:12.5px;color:var(--muted);margin-right:auto}
.ed-bar .state strong{color:var(--ink);font-weight:700}
.ed-panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ed-src,.ed-prev{min-height:0;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}
.pane-h{font-size:11px;letter-spacing:.16em;color:var(--muted);padding:8px 14px 0;font-weight:700}
#ed-title{border:0;padding:6px 18px 4px;font-family:var(--serif);font-weight:800;font-size:24px;line-height:1.45;background:var(--bg);color:var(--ink);width:100%}
#ed-title:focus{outline:none}
.tools{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;border-block:1px solid var(--line);background:var(--bg-2);align-items:center}
.tools button{border:0;background:none;border-radius:5px;padding:4px 9px;font-size:13px;cursor:pointer}
.tools button:hover{background:var(--bg)}
.tools .add{background:var(--blue);color:var(--blue-ink);font-weight:700;margin-left:auto}
.tools .add:hover{background:var(--blue);filter:brightness(1.08)}
#src{flex:1;min-height:0;border:0;resize:none;padding:16px 18px;font-family:var(--mono);font-size:14.5px;line-height:28px;background:var(--bg);color:var(--ink);tab-size:2}
#src:focus{outline:none}
#src::placeholder{color:var(--muted)}
.ed-stat{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ed-stat .hint{margin-left:auto}
.ed-stat kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--ink)}
.ed-prev .pv{flex:1;overflow:auto;padding:20px clamp(16px,3vw,40px) 60px}
.ed-prev .pv h1.pt{font-family:var(--serif);font-weight:800;font-size:28px;line-height:1.4;margin:0 0 28px;text-wrap:balance}

</style>

<div id="progress" aria-hidden="true"></div>
<header class="bar">
  <div class="bar-in">
    <a class="logo" href="#" aria-label="ホームへ"><span class="k">綴</span><span class="w">TSUZURI</span></a>
    <nav id="nav"></nav>
  </div>
</header>
<div id="notice-slot"></div>
<main id="root"><p class="empty-note">読み込み中…</p></main>
<div id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*,video/mp4,video/webm" hidden>

<script>
/* ========== 記法 → HTML ========== */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const safeUrl = u => /^\s*(javascript|data|vbscript):/i.test(u) ? '#' : u;

const BOX_ALIAS = {
  point: 'point', ポイント: 'point',
  memo: 'memo', note: 'memo', info: 'memo', メモ: 'memo', 補足: 'memo',
  warn: 'warn', warning: 'warn', 注意: 'warn',
  summary: 'summary', まとめ: 'summary',
};
const BOX_LABEL = { point: 'ポイント', memo: 'メモ', warn: '注意', summary: 'まとめ' };
const LIVE_ALIAS = {
  quiz: 'quiz', クイズ: 'quiz',
  calc: 'calc', 計算: 'calc',
  chart: 'chart', グラフ: 'chart',
  tabs: 'tabs', タブ: 'tabs',
  steps: 'steps', 手順: 'steps', ステップ: 'steps',
  details: 'details', 折りたたみ: 'details', 開閉: 'details',
  compare: 'compare', 比較: 'compare',
};
const LIVE_LABEL = { quiz: 'クイズ', calc: '計算', chart: 'グラフ', tabs: 'タブ', steps: '手順', details: '折りたたみ', compare: '比較' };

function makeCtx(posts, resolve) {
  return { posts: posts || [], resolve: resolve || (u => u), headings: [], links: new Set(), uid: 0 };
}

function inline(src, ctx) {
  const codes = [];
  let s = src.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s);
  s = s.replace(/\{([^{}|\n]+)\|([^{}\n]+)\}/g, (_, t, d) => `<button type="button" class="gl" data-tip="${d}">${t}</button>`);
  s = s.replace(/\[\[([^\]]+)\]\](?!\()/g, (_, t) => {
    const title = t.trim();
    ctx.links.add(title);
    const p = ctx.posts.find(x => x.title === title.replace(/&amp;/g, '&').replace(/&quot;/g, '"'));
    return p ? `<a class="wl" href="#${p.slug}">${title}</a>` : `<span class="wl missing" title="まだない記事">${title}</span>`;
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
    const ext = /^https?:/i.test(u) ? ' target="_blank" rel="noopener"' : '';
    return `<a href="${safeUrl(u)}"${ext}>${t}</a>`;
  });
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s](?:[^*]*?[^*\s])?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/~~(.+?)~~/g, '<s>$1</s>');
  s = s.replace(/==(.+?)==/g, '<mark>$1</mark>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
  return s.replace(/\n/g, '<br>');
}

const RE = {
  fence: /^```/,
  open: /^:::\s*([^\s:]+)\s*(.*)$/,
  close: /^:::\s*$/,
  heading: /^(#{1,4})\s+(.+)$/,
  hr: /^\s*(-{3,}|\*{3,}|_{3,})\s*$/,
  tableRow: /^\s*\|/,
  tableSep: /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/,
  quote: /^>\s?/,
  li: /^(\s*)([-*+]|\d+[.)])\s+(.*)$/,
  media: /^!\[([^\]]*)\]\(([^)\s]*)(?:\s+"([^"]*)")?\)\s*$/,
  button: /^\[\[(.+?)\]\]\((\S+?)\)\s*$/,
  url: /^(https?:\/\/\S+)\s*$/,
};

function startsBlock(lines, i) {
  const l = lines[i];
  return RE.fence.test(l) || RE.open.test(l) || RE.close.test(l) || RE.heading.test(l) || RE.hr.test(l) ||
    RE.quote.test(l) || RE.li.test(l) || RE.media.test(l) || RE.button.test(l) || RE.url.test(l) ||
    (RE.tableRow.test(l) && i + 1 < lines.length && RE.tableSep.test(lines[i + 1]));
}

const splitRow = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());

function renderList(items, ctx) {
  const root = { ordered: items[0].ordered, children: [] };
  const stack = [{ indent: -1, node: root }];
  for (const it of items) {
    while (stack.length > 1 && it.indent <= stack[stack.length - 1].indent) stack.pop();
    const parent = stack[stack.length - 1].node;
    const target = parent === root ? root : (parent.sub || (parent.sub = { ordered: it.ordered, children: [] }));
    const item = { text: it.text };
    target.children.push(item);
    stack.push({ indent: it.indent, node: item });
  }
  const out = l => {
    const tag = l.ordered ? 'ol' : 'ul';
    return `<${tag}>${l.children.map(c => `<li>${inline(c.text, ctx)}${c.sub ? out(c.sub) : ''}</li>`).join('')}</${tag}>`;
  };
  return out(root);
}

function media(alt, url, cap, ctx) {
  const c = cap ? `<figcaption>${inline(cap, ctx)}</figcaption>` : '';
  if (!url) return `<figure><div class="card"><span class="play">＋</span><span><span class="h">画像</span><br><span class="u">${esc(alt) || '画像が未設定です'}</span></span></div>${c}</figure>`;
  const src = esc(safeUrl(ctx.resolve(url)));
  if (/\.(mp4|webm|mov)(\?|$)/i.test(url)) return `<figure><video src="${src}" controls playsinline preload="metadata"></video>${c}</figure>`;
  return `<figure><img src="${src}" alt="${esc(alt)}" loading="lazy">${c}</figure>`;
}

function linkCard(url) {
  let host = '';
  try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { host = url; }
  const yt = /(^|\.)youtube\.com$|^youtu\.be$/.test(host);
  const vm = /(^|\.)vimeo\.com$/.test(host);
  const label = yt ? 'YouTube で見る' : vm ? 'Vimeo で見る' : 'リンク';
  const icon = yt || vm ? '▶' : '↗';
  return `<a class="card" href="${esc(safeUrl(url))}" target="_blank" rel="noopener"><span class="play">${icon}</span><span><span class="h">${label}</span><br><span class="u">${esc(url)}</span></span></a>`;
}

function sections(lines) {
  const out = [];
  for (const l of lines) {
    const m = l.match(/^@\s+(.+)$/);
    if (m) out.push({ name: m[1].trim(), lines: [] });
    else if (out.length) out[out.length - 1].lines.push(l);
    else if (l.trim()) out.push({ name: '', lines: [l] });
  }
  return out;
}

const liveFrame = (kind, title, body, extra = '') =>
  `<div class="live" data-live="${kind}"${extra}><div class="live-h"><span class="kind">${LIVE_LABEL[kind]}</span><span class="ttl">${title}</span></div>${body}</div>`;

function renderLive(kind, arg, inner, ctx) {
  const id = 'lv' + (++ctx.uid);
  const title = inline(arg, ctx);
  if (kind === 'details') {
    return `<details class="fold"><summary>${title || '詳しく'}</summary><div class="fold-b">${parse(inner, ctx)}</div></details>`;
  }
  if (kind === 'quiz') {
    const opts = [], expl = [];
    for (const l of inner) {
      let m;
      if ((m = l.match(RE.li))) { const ok = /^\*/.test(m[3]); opts.push({ ok, text: m[3].replace(/^\*\s*/, '') }); }
      else if (RE.quote.test(l)) expl.push(l.replace(RE.quote, ''));
    }
    const body = `<div class="live-b"><div class="quiz-opts">${opts.map((o, i) =>
      `<button type="button" class="quiz-opt" data-ok="${o.ok ? 1 : 0}"><span class="n">${i + 1}</span><span>${inline(o.text, ctx)}</span></button>`).join('')}</div>` +
      `<div class="quiz-res" hidden><div class="msg"></div>${expl.length ? `<div class="ex">${inline(expl.join('\n'), ctx)}</div>` : ''}<button type="button" class="btn ghost again">もう一度</button></div></div>`;
    return liveFrame('quiz', title || 'クイズ', body);
  }
  if (kind === 'calc') {
    const ins = [], outs = [];
    let after = false;
    for (const raw of inner) {
      const l = raw.trim();
      if (!l) continue;
      if (/^-{3,}$/.test(l)) { after = true; continue; }
      if (!after) {
        const m = l.match(/^(.+?)\s*=\s*(-?[\d.,]+)\s*([^(（]*?)\s*(?:[(（]\s*(-?[\d.]+)\s*[〜~～]\s*(-?[\d.]+)\s*[)）])?$/);
        if (m) ins.push({ name: m[1].trim(), value: parseFloat(m[2].replace(/,/g, '')), unit: m[3].trim(), min: m[4], max: m[5] });
      } else {
        const m = l.match(/^(.+?)\s*=\s*(.+?)(?:\s*\|\s*(.*))?$/);
        if (m) outs.push({ name: m[1].trim(), expr: m[2].trim(), unit: (m[3] || '').trim() });
      }
    }
    const body = `<div class="live-b"><div class="calc-in">${ins.map((v, i) => {
      const range = v.min != null ? `<input type="range" id="${id}-r${i}" min="${v.min}" max="${v.max}" step="${stepOf(v)}" value="${v.value}" data-i="${i}" aria-label="${esc(v.name)}">` : '';
      return `<div class="calc-row"><label for="${id}-n${i}"><span>${esc(v.name)}</span><span class="v"><input type="number" id="${id}-n${i}" value="${v.value}" step="any" data-i="${i}">${esc(v.unit)}</span></label>${range}</div>`;
    }).join('')}</div><div class="calc-out">${outs.map(o =>
      `<div class="calc-o"><span class="l">${esc(o.name)}</span><span class="r">–</span></div>`).join('')}</div></div>`;
    const spec = esc(JSON.stringify({ ins: ins.map(v => v.name), outs }));
    return liveFrame('calc', title || '計算', body, ` data-spec="${spec}"`);
  }
  if (kind === 'chart') {
    const rows = [];
    for (const l of inner) {
      if (!l.trim() || RE.tableSep.test(l)) continue;
      const cells = l.includes('|') ? splitRow(l) : l.trim().split(/\s+/);
      if (cells.length < 2) continue;
      const v = parseFloat(cells[cells.length - 1].replace(/,/g, ''));
      if (!isNaN(v)) rows.push({ label: cells.slice(0, -1).join(' '), value: v });
    }
    const max = Math.max(...rows.map(r => r.value), 0) || 1;
    const fmt = v => v.toLocaleString('ja-JP', { maximumFractionDigits: 2 });
    const body = `<div class="live-b"><div class="bars" role="list">${rows.map((r, i) =>
      `<div class="row-hit" role="listitem" tabindex="0" data-i="${i}" data-v="${r.value}" data-l="${esc(r.label)}"><span class="lb">${esc(r.label)}</span><span class="tr"><span class="fill" style="width:${Math.max(0, r.value / max * 100).toFixed(2)}%"></span></span><span class="vl">${fmt(r.value)}</span></div>`).join('')}</div>` +
      `<div class="bars-note">項目を選ぶと、前の項目との差が出ます</div></div>`;
    return liveFrame('chart', title || 'グラフ', body);
  }
  if (kind === 'tabs' || kind === 'steps') {
    const secs = sections(inner);
    const panels = secs.map((s, i) => `<div class="pnl" data-i="${i}"${i ? ' hidden' : ''}>${parse(s.lines, ctx)}</div>`).join('');
    if (kind === 'tabs') {
      const bar = `<div class="tabbar" role="tablist">${secs.map((s, i) => `<button type="button" role="tab" data-i="${i}" aria-selected="${i === 0}">${esc(s.name || 'タブ' + (i + 1))}</button>`).join('')}</div>`;
      return liveFrame('tabs', title || '切り替えて読む', bar + `<div class="live-b">${panels}</div>`);
    }
    const names = esc(JSON.stringify(secs.map(s => s.name)));
    const body = `<div class="live-b"><div class="steps-dots" data-names="${names}"></div><div style="margin-top:14px">${panels}</div>` +
      `<div class="steps-nav"><button type="button" class="btn prev">← 前へ</button><button type="button" class="btn primary next">次へ →</button></div></div>`;
    return liveFrame('steps', title || '手順', body);
  }
  if (kind === 'compare') {
    const imgs = inner.map(l => l.match(RE.media)).filter(Boolean);
    if (imgs.length < 2) return `<p>（比較には画像が2枚必要です）</p>`;
    const [a, b] = imgs;
    const body = `<div class="live-b"><div class="cmp" style="--x:50%"><img src="${esc(safeUrl(ctx.resolve(b[2])))}" alt="${esc(b[1])}">` +
      `<div class="top"><img src="${esc(safeUrl(ctx.resolve(a[2])))}" alt="${esc(a[1])}"></div><div class="handle"></div>` +
      `<input type="range" min="0" max="100" value="50" aria-label="左右の画像の境目"></div>` +
      `<div class="cmp-l"><span>← ${esc(a[1] || '前')}</span><span>${esc(b[1] || '後')} →</span></div></div>`;
    return liveFrame('compare', title || 'ドラッグして比べる', body);
  }
  return '';
}

function stepOf(v) {
  const span = Math.abs(v.max - v.min);
  const dec = Math.max(...[v.min, v.max, String(v.value)].map(x => (String(x).split('.')[1] || '').length));
  if (dec) return Math.pow(10, -dec);
  return span > 1000 ? 10 : 1;
}

function parse(lines, ctx) {
  const out = [];
  let i = 0, m;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*$/.test(line)) { i++; continue; }
    if (RE.fence.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if ((m = line.match(RE.open))) {
      const buf = []; let depth = 1; i++;
      while (i < lines.length) {
        if (RE.close.test(lines[i])) { if (--depth === 0) break; }
        else if (RE.open.test(lines[i])) depth++;
        buf.push(lines[i++]);
      }
      i++;
      const name = m[1], low = name.toLowerCase(), arg = m[2].trim();
      const live = LIVE_ALIAS[name] || LIVE_ALIAS[low];
      if (live) { out.push(renderLive(live, arg, buf, ctx)); continue; }
      const kind = BOX_ALIAS[name] || BOX_ALIAS[low];
      const label = arg || (kind ? BOX_LABEL[kind] : name);
      out.push(`<div class="box ${kind || 'memo'}"><p class="bx-t">${inline(label, ctx)}</p>${parse(buf, ctx)}</div>`);
      continue;
    }
    if (RE.close.test(line)) { i++; continue; }
    if ((m = line.match(RE.heading))) {
      const lv = Math.max(2, m[1].length);
      const id = 'h' + (ctx.headings.length + 1);
      const html = inline(m[2].trim(), ctx);
      ctx.headings.push({ id, lv, text: m[2].trim().replace(/[*=~`]/g, '') });
      out.push(`<h${lv} id="${id}">${html}</h${lv}>`);
      i++; continue;
    }
    if (RE.hr.test(line)) { out.push('<hr>'); i++; continue; }
    if (RE.tableRow.test(line) && i + 1 < lines.length && RE.tableSep.test(lines[i + 1])) {
      const head = splitRow(line); i += 2;
      const rows = [];
      while (i < lines.length && RE.tableRow.test(lines[i])) rows.push(splitRow(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c, ctx)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${head.map((_, k) => `<td>${inline(r[k] || '', ctx)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (RE.quote.test(line)) {
      const buf = [];
      while (i < lines.length && RE.quote.test(lines[i])) buf.push(lines[i++].replace(RE.quote, ''));
      out.push(`<blockquote>${parse(buf, ctx)}</blockquote>`);
      continue;
    }
    if (RE.li.test(line)) {
      const items = [];
      while (i < lines.length) {
        const lm = lines[i].match(RE.li);
        if (lm) items.push({ indent: lm[1].replace(/\t/g, '  ').length, ordered: /\d/.test(lm[2]), text: lm[3] });
        else if (/^\s+\S/.test(lines[i]) && items.length) items[items.length - 1].text += '\n' + lines[i].trim();
        else break;
        i++;
      }
      out.push(renderList(items, ctx));
      continue;
    }
    if ((m = line.match(RE.media))) { out.push(media(m[1], m[2], m[3], ctx)); i++; continue; }
    if (RE.button.test(line)) {
      const btns = [];
      while (i < lines.length && (m = lines[i].match(RE.button))) {
        const ext = /^https?:/i.test(m[2]) ? ' target="_blank" rel="noopener"' : '';
        btns.push(`<a class="cta" href="${esc(safeUrl(m[2]))}"${ext}>${inline(m[1], ctx)}</a>`); i++;
      }
      out.push(`<div class="btns">${btns.join('')}</div>`);
      continue;
    }
    if ((m = line.match(RE.url))) { out.push(linkCard(m[1])); i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !startsBlock(lines, i)) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join('\n'), ctx)}</p>`);
  }
  return out.join('\n');
}

function renderBody(body, posts, resolve) {
  const ctx = makeCtx(posts, resolve);
  const html = parse(String(body || '').replace(/\r\n?/g, '\n').split('\n'), ctx);
  return { html, headings: ctx.headings, links: ctx.links };
}

function liveKinds(body) {
  const counts = {};
  for (const m of String(body || '').matchAll(/^:::\s*([^\s:]+)/gm)) {
    const k = LIVE_ALIAS[m[1]] || LIVE_ALIAS[m[1].toLowerCase()];
    if (k) counts[k] = (counts[k] || 0) + 1;
  }
  return Object.keys(counts).map(k => LIVE_LABEL[k]);
}

/* ========== 計算式 ========== */
function evaluate(expr, vars) {
  const s = expr.normalize('NFKC').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  const names = Object.keys(vars).sort((a, b) => b.length - a.length);
  const toks = [];
  let i = 0;
  while (i < s.length) {
    if (/\s/.test(s[i])) { i++; continue; }
    const nm = names.find(n => s.startsWith(n.normalize('NFKC'), i));
    if (nm) { toks.push({ t: 'v', v: vars[nm] }); i += nm.normalize('NFKC').length; continue; }
    const num = s.slice(i).match(/^\d+(?:\.\d+)?/);
    if (num) { toks.push({ t: 'n', v: parseFloat(num[0]) }); i += num[0].length; continue; }
    if ('+-*/^%(),'.includes(s[i])) { toks.push({ t: s[i] }); i++; continue; }
    const id = s.slice(i).match(/^[^\s+\-*/^%(),]+/);
    toks.push({ t: 'id', v: id[0] }); i += id[0].length;
  }
  let p = 0;
  const peek = () => toks[p] && toks[p].t;
  const FN = { round: Math.round, floor: Math.floor, ceil: Math.ceil, abs: Math.abs, sqrt: Math.sqrt, min: Math.min, max: Math.max,
    四捨五入: Math.round, 切り捨て: Math.floor, 切り上げ: Math.ceil };
  function expr_() { let v = term(); while (peek() === '+' || peek() === '-') { const o = toks[p++].t; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
  function term() { let v = unary(); while (peek() === '*' || peek() === '/' || peek() === '%') { const o = toks[p++].t; const r = unary(); v = o === '*' ? v * r : o === '/' ? v / r : v % r; } return v; }
  function unary() { if (peek() === '-') { p++; return -unary(); } if (peek() === '+') { p++; return unary(); } return power(); }
  function power() { const b = primary(); if (peek() === '^') { p++; return Math.pow(b, unary()); } return b; }
  function primary() {
    const t = toks[p++];
    if (!t) throw new Error('式が途中で終わっています');
    if (t.t === 'n' || t.t === 'v') return t.v;
    if (t.t === '(') { const v = expr_(); if (toks[p++]?.t !== ')') throw new Error('かっこが閉じていません'); return v; }
    if (t.t === 'id') {
      const f = FN[t.v];
      if (f && peek() === '(') {
        p++; const args = [];
        if (peek() !== ')') { args.push(expr_()); while (peek() === ',') { p++; args.push(expr_()); } }
        if (toks[p++]?.t !== ')') throw new Error('かっこが閉じていません');
        return f(...args);
      }
      throw new Error(`「${t.v}」が見つかりません`);
    }
    throw new Error('式を読めません');
  }
  const v = expr_();
  if (p < toks.length) throw new Error('式を読めません');
  return v;
}

/* ========== 動く要素を有効にする ========== */
function hydrate(root) {
  root.querySelectorAll('[data-live="quiz"]').forEach(el => {
    const opts = [...el.querySelectorAll('.quiz-opt')];
    const res = el.querySelector('.quiz-res');
    opts.forEach(b => b.addEventListener('click', () => {
      const ok = b.dataset.ok === '1';
      opts.forEach(o => { o.disabled = true; if (o.dataset.ok === '1') o.classList.add('ok'); });
      if (!ok) b.classList.add('ng');
      res.querySelector('.msg').innerHTML = ok ? '<strong class="ok">正解です。</strong>' : '<strong class="ng">ちがいます。</strong>正解は緑の選択肢です。';
      res.hidden = false;
    }));
    res.querySelector('.again').addEventListener('click', () => {
      opts.forEach(o => { o.disabled = false; o.classList.remove('ok', 'ng'); });
      res.hidden = true;
    });
  });

  root.querySelectorAll('[data-live="calc"]').forEach(el => {
    let spec;
    try { spec = JSON.parse(el.dataset.spec); } catch { return; }
    const nums = [...el.querySelectorAll('input[type=number]')];
    const outs = [...el.querySelectorAll('.calc-o')];
    const fmt = v => Math.abs(v) >= 100 ? Math.round(v).toLocaleString('ja-JP') : v.toLocaleString('ja-JP', { maximumFractionDigits: 2 });
    const run = () => {
      const vars = {};
      spec.ins.forEach((n, i) => { vars[n] = parseFloat(nums[i].value) || 0; });
      spec.outs.forEach((o, i) => {
        const r = outs[i].querySelector('.r');
        try {
          const v = evaluate(o.expr, vars);
          vars[o.name] = v;
          outs[i].classList.remove('err');
          r.innerHTML = isFinite(v) ? `${fmt(v)}<small>${esc(o.unit)}</small>` : '計算できません';
        } catch (e) { outs[i].classList.add('err'); r.textContent = e.message; }
      });
    };
    el.addEventListener('input', e => {
      const i = e.target.dataset.i;
      if (i == null) return;
      const pair = el.querySelectorAll(`[data-i="${i}"]`);
      pair.forEach(x => { if (x !== e.target) x.value = e.target.value; });
      run();
    });
    run();
  });

  root.querySelectorAll('[data-live="chart"]').forEach(el => {
    const bars = el.querySelector('.bars'), note = el.querySelector('.bars-note');
    const rows = [...el.querySelectorAll('.row-hit')];
    const fmt = v => v.toLocaleString('ja-JP', { maximumFractionDigits: 2 });
    const pick = r => {
      rows.forEach(x => x.classList.toggle('on', x === r));
      bars.classList.add('focus');
      const i = +r.dataset.i, v = +r.dataset.v;
      if (i === 0) { note.innerHTML = `<strong>${esc(r.dataset.l)}</strong>：${fmt(v)}（最初の項目）`; return; }
      const prev = +rows[i - 1].dataset.v, d = v - prev;
      const pct = prev ? `（${d >= 0 ? '+' : ''}${fmt(d / prev * 100)}%）` : '';
      note.innerHTML = `<strong>${esc(r.dataset.l)}</strong>：${fmt(v)}　${esc(rows[i - 1].dataset.l)}から ${d >= 0 ? '+' : ''}${fmt(d)} ${pct}`;
    };
    rows.forEach(r => {
      r.addEventListener('click', () => pick(r));
      r.addEventListener('mouseenter', () => pick(r));
      r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(r); } });
    });
  });

  root.querySelectorAll('[data-live="tabs"]').forEach(el => {
    const tabs = [...el.querySelectorAll('[role=tab]')], pnls = [...el.querySelectorAll('.pnl')];
    tabs.forEach(t => t.addEventListener('click', () => {
      tabs.forEach(x => x.setAttribute('aria-selected', String(x === t)));
      pnls.forEach(p => { p.hidden = p.dataset.i !== t.dataset.i; });
    }));
  });

  root.querySelectorAll('[data-live="steps"]').forEach(el => {
    const pnls = [...el.querySelectorAll('.pnl')];
    const dots = el.querySelector('.steps-dots');
    let names = [];
    try { names = JSON.parse(dots.dataset.names); } catch {}
    const prev = el.querySelector('.prev'), next = el.querySelector('.next');
    let cur = 0;
    const show = n => {
      cur = Math.max(0, Math.min(pnls.length - 1, n));
      pnls.forEach((p, i) => { p.hidden = i !== cur; });
      dots.innerHTML = pnls.map((_, i) => `<button type="button" data-i="${i}" class="${i === cur ? 'cur' : i < cur ? 'done' : ''}" aria-label="ステップ${i + 1}">${i + 1}</button>`).join('') +
        `<span class="lbl">${esc(names[cur] || '')}</span>`;
      prev.disabled = cur === 0;
      next.textContent = cur === pnls.length - 1 ? '最初に戻る' : '次へ →';
    };
    dots.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); });
    prev.addEventListener('click', () => show(cur - 1));
    next.addEventListener('click', () => show(cur === pnls.length - 1 ? 0 : cur + 1));
    show(0);
  });

  root.querySelectorAll('.cmp').forEach(el => {
    const r = el.querySelector('input');
    r.addEventListener('input', () => el.style.setProperty('--x', r.value + '%'));
  });
}

/* 用語の説明（全体で1つの吹き出し） */
const tip = document.getElementById('tip');
let tipFor = null;
function showTip(b) {
  tipFor = b;
  tip.textContent = b.dataset.tip;
  tip.hidden = false;
  const r = b.getBoundingClientRect();
  const w = tip.offsetWidth;
  const left = Math.max(16, Math.min(window.scrollX + r.left + r.width / 2 - w / 2, window.scrollX + document.documentElement.clientWidth - w - 16));
  tip.style.left = left + 'px';
  tip.style.top = (window.scrollY + r.bottom + 8) + 'px';
}
function hideTip() { tip.hidden = true; tipFor = null; }
document.addEventListener('click', e => {
  const b = e.target.closest('.gl');
  if (b) { e.preventDefault(); tipFor === b ? hideTip() : showTip(b); }
  else if (!e.target.closest('#tip')) hideTip();
});
document.addEventListener('mouseover', e => { const b = e.target.closest('.gl'); if (b && matchMedia('(hover:hover)').matches) showTip(b); });
document.addEventListener('mouseout', e => { if (e.target.closest('.gl') && matchMedia('(hover:hover)').matches) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
window.addEventListener('scroll', () => { if (tipFor) hideTip(); }, { passive: true });

/* ========== アプリ ========== */
const $ = id => document.getElementById(id);
const root = $('root');
const S = {
  data: null,
  art: null,
  canWrite: false,
  hasRuntime: !!window.claude,
  view: 'read',
  editSlug: null,
  dirty: false,
  pending: {},
  blobs: {},
  pane: 'src',
};
const resolve = u => S.blobs[u] || u;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = d => (d || '').replace(/-/g, '.');
const readMin = body => Math.max(1, Math.round(String(body || '').replace(/\s/g, '').length / 500));
const excerpt = body => String(body || '').split('\n').filter(l => l.trim() && !/^(#|:::|```|!\[|\||>|-|\d+\.|@|\[\[)/.test(l.trim())).join(' ')
  .replace(/\{([^{}|]+)\|[^{}]+\}/g, '$1').replace(/\[\[([^\]]+)\]\]/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[*=~`]/g, '').slice(0, 120);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

function visiblePosts() {
  return S.data.posts.filter(p => !p.draft).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}

function renderNav() {
  const nav = $('nav');
  nav.innerHTML = S.view === 'read' && S.canWrite ? `<button class="btn primary" type="button" id="new-post">＋ 新しい記事</button>` : '';
  $('new-post')?.addEventListener('click', newPost);
}

function renderHome() {
  const posts = S.canWrite ? [...S.data.posts].sort((a, b) => (b.date || '').localeCompare(a.date || '')) : visiblePosts();
  document.title = S.data.site.name || 'Tsuzuri';
  const site = S.data.site;
  root.innerHTML = `<section class="home-head"><h1>${esc(site.name || '無題のサイト')}</h1>${site.tagline ? `<p>${esc(site.tagline)}</p>` : ''}` +
    (S.canWrite ? `<button class="btn ghost" type="button" id="site-open" style="margin-top:10px;margin-left:-10px">サイト名と説明を変える</button>` +
      `<form class="site-edit" id="site-form" hidden><input id="site-name" aria-label="サイト名" placeholder="サイト名" value="${esc(site.name || '')}">` +
      `<input id="site-tag" aria-label="サイトの説明" placeholder="サイトの説明（1行）" value="${esc(site.tagline || '')}">` +
      `<div class="row"><button class="btn primary" type="submit">保存</button><button class="btn ghost" type="button" id="site-cancel">やめる</button></div></form>` : '') +
    `</section><section class="posts" aria-label="記事一覧">${posts.length ? posts.map(p => {
      const kinds = liveKinds(p.body);
      const chips = [...(p.draft ? ['<span class="chip draft">下書き（読者には見えません）</span>'] : []), ...kinds.map(k => `<span class="chip">${k}</span>`)];
      return `<div class="pr${S.canWrite ? ' w' : ''}"><a class="post-row" href="#${p.slug}"><time>${fmtDate(p.date)}</time><div><h2 class="t">${esc(p.title || '無題')}</h2></div>` +
        `<p class="x">${esc(excerpt(p.body))}</p>${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}` +
        `</a>${S.canWrite ? `<button class="btn row-edit" type="button" data-edit="${esc(p.slug)}">編集</button>` : ''}</div>`;
    }).join('') : `<div class="empty-note"><p>まだ記事がありません</p>${S.canWrite ? '<button class="btn primary" type="button" id="first-post">最初の記事を書く</button>' : ''}</div>`}</section>`;
  root.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); openEditor(b.dataset.edit); }));
  $('first-post')?.addEventListener('click', newPost);
  const form = $('site-form');
  if (form) {
    $('site-open').addEventListener('click', () => { form.hidden = false; $('site-open').hidden = true; $('site-name').focus(); });
    $('site-cancel').addEventListener('click', () => renderHome());
    form.addEventListener('submit', async e => {
      e.preventDefault();
      site.name = $('site-name').value.trim() || site.name;
      site.tagline = $('site-tag').value.trim();
      S.dirty = true;
      if (await save()) renderHome();
    });
  }
  setProgress(0);
}

function renderPost(p) {
  document.title = p.title + ' — ' + (S.data.site.name || 'Tsuzuri');
  const r = renderBody(p.body, S.data.posts, resolve);
  const back = S.data.posts.filter(o => o !== p && !o.draft && o.body.includes(`[[${p.title}]]`));
  const kinds = liveKinds(p.body);
  const toc = r.headings.length > 1 ? `<nav class="toc" aria-label="目次"><h2>目次</h2><ol>${r.headings.filter(h => h.lv <= 3).map(h =>
    `<li class="l${h.lv}"><a href="#${p.slug}" data-to="${h.id}">${esc(h.text)}</a></li>`).join('')}</ol></nav>` : '';
  const others = visiblePosts().filter(o => o !== p).slice(0, 3);
  root.innerHTML = `<div class="post-layout"><article class="article"><header class="article-head"><h1>${esc(p.title)}</h1>` +
    `<div class="meta"><time>${fmtDate(p.date)}</time><span>約${readMin(p.body)}分で読めます</span>${kinds.map(k => `<span class="chip">${k}</span>`).join('')}${p.draft ? '<span class="chip draft">下書き</span>' : ''}</div></header>` +
    `<div class="prose">${r.html}</div>` +
    `<footer class="post-foot">${back.length ? `<div><h2>この記事にリンクしている記事</h2><ul>${back.map(o => `<li><a href="#${o.slug}">${esc(o.title)}</a></li>`).join('')}</ul></div>` : ''}` +
    `${others.length ? `<div><h2>ほかの記事</h2><ul>${others.map(o => `<li><a href="#${o.slug}">${esc(o.title)}</a></li>`).join('')}</ul></div>` : ''}` +
    `<div><a class="btn" href="#">← 記事一覧へ</a>${S.canWrite ? ` <button class="btn" type="button" id="edit-this">この記事を編集</button>` : ''}</div></footer></article>${toc}</div>`;
  hydrate(root);
  root.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById(a.dataset.to)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }));
  $('edit-this')?.addEventListener('click', () => openEditor(p.slug));
  window.scrollTo(0, 0);
  onScroll();
}

function route() {
  hideTip();
  renderNav();
  if (S.view === 'edit') return renderEditor();
  const slug = decodeURIComponent(location.hash.slice(1));
  const p = slug && S.data.posts.find(x => x.slug === slug && (!x.draft || S.canWrite));
  if (p) renderPost(p);
  else { renderHome(); window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', () => { if (S.view !== 'read') S.view = 'read'; route(); });

function setProgress(v) { $('progress').style.width = (v * 100) + '%'; }
let tocLinks = [];
function onScroll() {
  if (S.view !== 'read' || !root.querySelector('.article')) { setProgress(0); return; }
  const art = root.querySelector('.article');
  const r = art.getBoundingClientRect();
  const total = r.height - innerHeight + 120;
  setProgress(Math.max(0, Math.min(1, total > 0 ? -r.top / total : 1)));
  const hs = [...root.querySelectorAll('.prose h2, .prose h3')];
  let cur = null;
  for (const h of hs) if (h.getBoundingClientRect().top < 120) cur = h.id;
  root.querySelectorAll('.toc a').forEach(a => a.classList.toggle('on', a.dataset.to === cur));
}
window.addEventListener('scroll', onScroll, { passive: true });

/* ---- 編集 ---- */
function backup() { try { localStorage.setItem('tsuzuri-backup', JSON.stringify({ at: Date.now(), data: S.data })); } catch {} }
function markDirty() { S.dirty = true; backup(); updateState(); }

function newPost() {
  const slug = 'p-' + Date.now().toString(36);
  S.data.posts.push({ slug, title: '', date: today(), draft: true, body: '' });
  S.dirty = true;
  openEditor(slug);
}
function openEditor(slug) { S.view = 'edit'; S.editSlug = slug; route(); window.scrollTo(0, 0); }
function closeEditor() {
  const p = S.data.posts.find(x => x.slug === S.editSlug);
  const back = $('ed-back');
  const empty = p && !p.title.trim() && !p.body.trim();
  if (!empty && (S.dirty || Object.keys(S.pending).length) && back && !back.classList.contains('armed')) {
    back.classList.add('armed'); back.textContent = '保存せずに戻る';
    toast('保存していない変更があります。戻るならもう一度押してください');
    setTimeout(() => { back.classList.remove('armed'); back.textContent = '← 戻る'; }, 4000);
    return;
  }
  if (empty) { S.data.posts = S.data.posts.filter(x => x !== p); S.dirty = false; }
  S.view = 'read';
  if (p && S.data.posts.includes(p) && location.hash !== '#' + p.slug) location.hash = p.slug;
  else route();
}

  { g: '動く要素', live: 1, ic: '①', name: '手順', ds: '@ で区切った手順を1つずつ進める', keys: 'steps tejun', text: ':::steps\n@ 手順1\n内容\n@ 手順2\n内容\n:::', sel: '手順1' },
  { g: '動く要素', live: 1, ic: '＋', name: '折りたたみ', ds: '押すと開く。補足や長い説明に', keys: 'details oritatami', text: ':::details 開くと読める見出し\n内容\n:::', sel: '開くと読める見出し' },
  { g: '動く要素', live: 1, ic: '⇆', name: '比較', ds: '2枚の画像を境目をずらして比べる', keys: 'compare hikaku before after', text: ':::compare\n![前](画像のURL)\n![後](画像のURL)\n:::' },
];

function renderEditor() {
  const p = S.data.posts.find(x => x.slug === S.editSlug);
  if (!p) { S.view = 'read'; return route(); }
  root.innerHTML = `<section class="editor" data-pane="${S.pane}">
    <div class="ed-bar">
      <button class="btn ghost" type="button" id="ed-back">← 戻る</button>
      <span class="state" id="ed-state"></span>
      <button class="btn" type="button" id="ed-draft">下書き保存</button>
      <button class="btn primary" type="button" id="ed-pub">公開する</button>
    </div>
    <details class="settings"><summary>記事の設定（URL・日付・削除）</summary><div class="set-grid">
      <label class="field">記事のURLの末尾（半角英数とハイフン）<input id="ed-slug" value="${esc(p.slug)}"></label>
      <label class="field" style="flex:0 0 160px;min-width:0">日付<input id="ed-date" type="date" value="${esc(p.date || today())}"></label>
      <button class="btn" type="button" id="ed-unpub"${p.draft ? ' hidden' : ''}>非公開に戻す</button>
      <button class="btn" type="button" id="ed-del">この記事を削除</button>
    </div></details>
    <div class="ed-tabs" role="tablist"><button type="button" data-pane="src" aria-selected="${S.pane === 'src'}">書く</button><button type="button" data-pane="prev" aria-selected="${S.pane === 'prev'}">読者に見える形</button></div>
    <div class="ed-panes">
      <div class="ed-src">
        <input id="ed-title" placeholder="タイトル" value="${esc(p.title)}" aria-label="タイトル">
        <div class="tools" id="tools">
          <button type="button" data-w="**" title="太字（⌘B / Ctrl+B）"><b>太字</b></button>
          <button type="button" data-w="==" title="マーカー（⌘M / Ctrl+M）">マーカー</button>
          <button type="button" data-link title="リンク（⌘K / Ctrl+K）">リンク</button>
          <button type="button" class="add" id="open-parts">＋ 部品を入れる</button>
        </div>
        <textarea id="src" spellcheck="false" aria-label="本文" placeholder="ここに本文を書きます。&#10;&#10;行の先頭で「/」を押すと、見出し・画像・クイズなどの部品を選べます。"></textarea>
        <div class="ed-stat" id="ed-stat"></div>
        <div class="palette" id="palette" hidden role="listbox" aria-label="部品"></div>
      </div>
      <div class="ed-prev"><div class="pane-h">読者に見える形</div><div class="pv" id="pv"></div></div>
    </div>
  </section>`;
  const src = $('src');
  src.value = p.body;
  let t;
  const refresh = () => {
    const r = renderBody(src.value, S.data.posts, resolve);
    $('pv').innerHTML = `<h1 class="pt${p.title ? '' : ' empty'}">${esc(p.title || 'タイトル')}</h1><div class="prose">${r.html}</div>`;
    hydrate($('pv'));
    $('ed-stat').innerHTML = `<span>${src.value.replace(/\s/g, '').length.toLocaleString()} 字</span><span>約${readMin(src.value)}分で読めます</span>` +
      `<span class="hint">行の先頭で <kbd>/</kbd> を押すと部品を選べます</span>`;
  };
  refresh();
  updateState();
  if (!p.title) $('ed-title').focus(); else src.focus();

  src.addEventListener('input', () => {
    p.body = src.value;
    markDirty();
    clearTimeout(t); t = setTimeout(refresh, 150);
    slashCheck();
  });
  $('ed-title').addEventListener('input', e => {
    const old = p.title;
    p.title = e.target.value;
    for (const o of S.data.posts) if (o !== p && old && o.body.includes(`[[${old}]]`)) o.body = o.body.split(`[[${old}]]`).join(`[[${p.title}]]`);
    markDirty(); refresh();
  });
  $('ed-title').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); src.focus(); } });
  $('ed-slug').addEventListener('change', e => {
    const v = e.target.value.trim().replace(/[^A-Za-z0-9._~-]/g, '-');
    if (!v || S.data.posts.some(o => o !== p && o.slug === v)) { e.target.value = p.slug; toast('そのURLは使えません（空か、ほかの記事と同じです）'); return; }
    e.target.value = v; p.slug = v; S.editSlug = v; markDirty();
  });
  $('ed-date').addEventListener('change', e => { p.date = e.target.value; markDirty(); });
  $('ed-back').addEventListener('click', closeEditor);
  $('ed-draft').addEventListener('click', async () => { p.draft = true; S.dirty = true; if (await save()) toast('下書きを保存しました。読者には見えません'); updateState(); });
  $('ed-pub').addEventListener('click', async () => {
    if (!p.title.trim()) { toast('タイトルを入れてください'); $('ed-title').focus(); return; }
    const first = p.draft;
    p.draft = false; S.dirty = true;
    if (await save()) { toast(first ? '公開しました。読者が読めるようになりました' : '更新しました'); updateState(); }
  });
  $('ed-unpub').addEventListener('click', async () => { p.draft = true; S.dirty = true; if (await save()) toast('非公開にしました。読者には見えません'); updateState(); });
  const del = $('ed-del');
  del.addEventListener('click', async () => {
    if (!del.classList.contains('armed')) {
      del.classList.add('armed'); del.textContent = 'もう一度押すと削除します';
      setTimeout(() => { del.classList.remove('armed'); del.textContent = 'この記事を削除'; }, 3000);
      return;
    }
    S.data.posts = S.data.posts.filter(o => o !== p);
    S.dirty = true;
    if (await save()) { toast('記事を削除しました'); S.view = 'read'; location.hash = ''; route(); }
  });
  root.querySelectorAll('.ed-tabs button').forEach(b => b.addEventListener('click', () => {
    S.pane = b.dataset.pane;
    root.querySelector('.editor').dataset.pane = S.pane;
    root.querySelectorAll('.ed-tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  }));

  const wrap = (pre, ph, post) => {
    const s = src.selectionStart, en = src.selectionEnd;
    const sel = src.value.slice(s, en) || ph;
    src.setRangeText(pre + sel + post, s, en, 'end');
    src.setSelectionRange(s + pre.length, s + pre.length + sel.length);
    src.dispatchEvent(new Event('input'));
  };
  const link = () => wrap('[', 'リンクの文字', '](https://)');
  $('tools').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'open-parts') { openPalette(null); return; }
    src.focus();
    if (b.dataset.w) wrap(b.dataset.w, b.dataset.w === '**' ? '太字' : 'マーカー', b.dataset.w);
    else if ('link' in b.dataset) link();
  });

  /* 部品パレット */
  const pal = $('palette');
  let palItems = [], palSel = 0, palSlash = null;
  function openPalette(slash) {
    palSlash = slash;
    const tools = $('tools');
    pal.style.top = (tools.offsetTop + tools.offsetHeight + 6) + 'px';
    pal.hidden = false;
    drawPalette(slash ? slash.q : '');
  }
  function closePalette() { pal.hidden = true; palSlash = null; }
  function drawPalette(q) {
    const k = q.trim().toLowerCase();
    palItems = PARTS.filter(x => !k || x.name.includes(k) || x.keys.includes(k) || x.ds.includes(k));
    palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
    if (!palItems.length) { pal.innerHTML = `<div class="none">「${esc(q)}」に合う部品がありません。Esc で閉じます</div>`; return; }
    const groups = [...new Set(palItems.map(x => x.g))];
    let n = 0;
    pal.innerHTML = groups.map(g => `<div class="grp">${g}</div><div class="items">${palItems.filter(x => x.g === g).map(x => {
      const i = palItems.indexOf(x); n++;
      return `<button type="button" role="option" class="part${x.live ? ' live' : ''}${i === palSel ? ' sel' : ''}" data-i="${i}"><span class="ic">${x.ic}</span><span><span class="nm">${x.name}</span><span class="ds">${esc(x.ds)}</span></span></button>`;
    }).join('')}</div>`).join('');
    pal.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
  }
  function choose(i) {
    const part = palItems[i];
    if (!part) return;
    if (palSlash) {
      src.setRangeText('', palSlash.start, palSlash.end, 'start');
    }
    closePalette();
    src.focus();
    if (part.action === 'file') { $('file').click(); return; }
    insertBlock(src, part.text);
    if (part.sel) {
      const at = src.value.lastIndexOf(part.text, src.selectionStart);
      const off = part.text.indexOf(part.sel);
      if (at >= 0 && off >= 0) src.setSelectionRange(at + off, at + off + part.sel.length);
    }
    src.dispatchEvent(new Event('input'));
    if (part.live) toast(part.ds);
  }
  pal.addEventListener('mousedown', e => e.preventDefault());
  pal.addEventListener('click', e => { const b = e.target.closest('.part'); if (b) choose(+b.dataset.i); });
  function slashCheck() {
    const s = src.selectionStart;
    const ls = src.value.lastIndexOf('\n', s - 1) + 1;
    const m = src.value.slice(ls, s).match(/^\/(\S*)$/);
    if (m) { palSel = palSlash && palSlash.q === m[1] ? palSel : 0; openPalette({ start: ls, end: s, q: m[1] }); }
    else if (palSlash) closePalette();
  }
  src.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== src && !pal.contains(document.activeElement)) closePalette(); }, 120));

  src.addEventListener('keydown', e => {
    if (!pal.hidden) {
      const cols = Math.max(1, Math.round(pal.querySelector('.items')?.clientWidth / 212) || 1);
      if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + cols); drawPalette(palSlash ? palSlash.q : ''); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - cols); drawPalette(palSlash ? palSlash.q : ''); return; }
      if (e.key === 'ArrowRight' && palSlash) { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); drawPalette(palSlash.q); return; }
      if (e.key === 'ArrowLeft' && palSlash) { e.preventDefault(); palSel = Math.max(0, palSel - 1); drawPalette(palSlash.q); return; }
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); choose(palSel); return; }
      if (e.key === 'Escape') { e.preventDefault(); closePalette(); return; }
    }
    const mod = e.metaKey || e.ctrlKey;
    if (mod && !e.shiftKey && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === 'b') { e.preventDefault(); wrap('**', '太字', '**'); return; }
      if (k === 'm') { e.preventDefault(); wrap('==', 'マーカー', '=='); return; }
      if (k === 'k') { e.preventDefault(); link(); return; }
      if (k === 's') { e.preventDefault(); (p.draft ? $('ed-draft') : $('ed-pub')).click(); return; }
    }
    if (e.key === 'Tab' && !e.isComposing) {
      e.preventDefault();
      const s = src.selectionStart, ls = src.value.lastIndexOf('\n', s - 1) + 1;
      if (e.shiftKey) { if (src.value.startsWith('  ', ls)) { src.setRangeText('', ls, ls + 2, 'preserve'); src.setSelectionRange(Math.max(ls, s - 2), Math.max(ls, s - 2)); } }
      else { src.setRangeText('  ', ls, ls, 'preserve'); src.setSelectionRange(s + 2, s + 2); }
      src.dispatchEvent(new Event('input'));
    }
  });
  document.addEventListener('keydown', function esc_(e) {
    if (!document.body.contains(pal)) { document.removeEventListener('keydown', esc_); return; }
    if (e.key === 'Escape' && !pal.hidden) closePalette();
  });
  src.addEventListener('paste', e => {
    const f = [...(e.clipboardData?.files || [])][0];
    if (f && /^image\//.test(f.type)) { e.preventDefault(); addMedia(f); }
  });
  src.addEventListener('dragover', e => e.preventDefault());
  src.addEventListener('drop', e => {
    const f = [...(e.dataTransfer?.files || [])][0];
    if (f) { e.preventDefault(); addMedia(f); }
  });
}

function updateState() {
  const el = $('ed-state');
  if (!el) return;
  const p = S.data.posts.find(x => x.slug === S.editSlug);
  if (!p) return;
  const status = p.draft ? '<strong>下書き</strong>（読者には見えません）' : '<strong>公開中</strong>';
  el.innerHTML = status + (S.dirty || Object.keys(S.pending).length ? '・保存していない変更があります' : '・保存済み');
  const pub = $('ed-pub');
  if (pub) pub.textContent = p.draft ? '公開する' : '更新を公開する';
  const dr = $('ed-draft');
  if (dr) dr.hidden = !p.draft;
  const un = $('ed-unpub');
  if (un) un.hidden = p.draft;
}

function insertBlock(src, text) {
  const s = src.selectionStart, v = src.value;
  const before = v.slice(0, s);
  const pre = !before ? '' : before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
  src.setRangeText(pre + text + '\n', s, src.selectionEnd, 'end');
}

$('file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) addMedia(f); });

async function addMedia(file) {
  const src = $('src');
  if (!src) return;
  let blob = file, ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  if (/^image\//.test(file.type) && !/svg|gif/.test(file.type)) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const png = file.type === 'image/png' && file.size < 400000;
      blob = await new Promise(r => c.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.86));
      ext = png ? 'png' : 'jpg';
    } catch {}
  } else if (/^video\//.test(file.type)) {
    if (file.size > 15 * 1024 * 1024) { toast('動画は15MBまでです。短く切るか、YouTubeのURLを貼ってください'); return; }
    ext = file.type === 'video/webm' ? 'webm' : 'mp4';
  } else if (!/^image\//.test(file.type)) { toast('画像か動画（mp4・webm）を選んでください'); return; }
  const path = `img/${Date.now().toString(36)}.${ext}`;
  S.pending[path] = blob;
  S.blobs[path] = URL.createObjectURL(blob);
  const alt = file.name.replace(/\.[^.]+$/, '');
  insertBlock(src, `![${alt}](${path})`);
  src.dispatchEvent(new Event('input'));
  toast(S.art ? '画像を追加しました。「公開する」でアップロードされます' : '画像を追加しました（この画面では保存できません）');
}

/* ---- 保存（このページ自体の新しい版として公開） ---- */
async function save() {
  if (!S.art) { toast(S.hasRuntime ? 'このページを編集する権限がありません' : 'この画面では保存できません。Claude 上で開いてください'); return false; }
  if (S.saving) return false;
  S.saving = true;
  const btns = [...document.querySelectorAll('#ed-pub, #ed-draft')];
  btns.forEach(b => { b.disabled = true; });
  const files = { 'tsuzuri.json': JSON.stringify(S.data, null, 1) };
  for (const [k, v] of Object.entries(S.pending)) files[k] = v;
  try { sessionStorage.setItem('tsuzuri-unsaved', JSON.stringify(S.data)); } catch {}
  let ok = false;
  try {
    await S.art.publish(files);
    S.dirty = false; S.pending = {}; ok = true;
    try { sessionStorage.removeItem('tsuzuri-unsaved'); localStorage.removeItem('tsuzuri-backup'); } catch {}
  } catch (e) {
    const code = e && e.code;
    if (code === 'conflict') toast('ほかの人が先に保存しました。最新の版を読み込み直します');
    else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') { S.canWrite = false; S.view = 'read'; toast('このページを編集する権限がありません'); route(); }
    else if (code === 'capability_disabled' || code === 'capability_removed') toast('この開き方では保存できません（一般公開のリンクからは編集できません）');
    else if (code === 'too_large') toast('ファイルが大きすぎます。画像や動画を小さくしてください');
    else if (code === 'rate_limited') toast('保存が続いています。少し待ってからもう一度押してください');
    else toast('保存できませんでした。少し待ってからもう一度押してください');
  }
  S.saving = false;
  btns.forEach(b => { b.disabled = false; });
  return ok;
}
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

function showRestore(saved) {
  $('notice-slot').innerHTML = `<div class="notice" style="margin-inline:16px"><span>保存できなかった変更が残っています。</span><button class="btn primary" type="button" id="rs-yes">その変更を保存する</button><button class="btn ghost" type="button" id="rs-no">捨てる</button></div>`;
  $('rs-yes').addEventListener('click', async () => { S.data = saved; S.dirty = true; if (await save()) { $('notice-slot').innerHTML = ''; toast('残っていた変更を保存しました'); route(); } });
  $('rs-no').addEventListener('click', () => { try { sessionStorage.removeItem('tsuzuri-unsaved'); localStorage.removeItem('tsuzuri-backup'); } catch {} $('notice-slot').innerHTML = ''; });
}

async function boot() {
  try {
    const res = await fetch('tsuzuri.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    S.data = await res.json();
  } catch {
    S.data = { site: { name: 'Tsuzuri', tagline: '' }, posts: [] };
  }
  S.data.site = S.data.site || { name: 'Tsuzuri' };
  S.data.posts = S.data.posts || [];
  route();

  if (window.claude && claude.use) {
    const [art, user] = await Promise.all([claude.use('artifact'), claude.use('user')]);
    S.art = art;
    let edit = false;
    if (art) { try { edit = user ? await user.canEdit() : true; } catch { edit = true; } }
    S.canWrite = !!edit;
  } else {
    S.canWrite = true;
  }
  if (S.canWrite) {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('tsuzuri-unsaved') || localStorage.getItem('tsuzuri-backup') || 'null'); } catch {}
    if (saved) showRestore(saved.data || saved);
    if (!S.art) $('notice-slot').insertAdjacentHTML('beforeend', `<div class="notice warn" style="margin-inline:16px">この画面では書いた内容を公開できません。試し書きだけできます。</div>`);
  }
  if (S.view === 'read') route();
}
boot();
</script>
